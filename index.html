async function setRegion(uf){const r=await SB.rpc('set_region',{p_uf:uf});if(r.error)return toast('Não foi possível salvar a região.');ME.state=uf;toast(uf?'✅ Região salva: '+uf:'Região removida');go('me')}
function pickPhoto(){$('pf').click()}
function photoPick(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Use uma imagem JPEG, PNG ou WebP.');if(f.size>5*1048576)return toast('A imagem deve ter no máximo 5 MB.');
const img=new Image(),u=URL.createObjectURL(f);img.onerror=()=>toast('Não foi possível abrir essa imagem.');
img.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d'),s=Math.min(img.width,img.height);c.width=c.height=256;x.fillStyle='#1b1f12';x.fillRect(0,0,256,256);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);URL.revokeObjectURL(u);
c.toBlob(b=>{if(!b)return toast('Não foi possível processar a imagem.');PH=b;const o=document.createElement('div');o.className='ov';o.id='phov';o.innerHTML=`<div class="ovc"><h3 style="margin:0 0 10px">Prévia da foto</h3><img class="av" style="width:160px;height:160px" src="${URL.createObjectURL(b)}"><p class="mu">${Math.round(b.size/1024)} KB (reduzida para 256×256)</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="photoSave()">Salvar foto</button><button class="btn g" onclick="$('phov').remove()">Cancelar</button></div></div>`;document.body.appendChild(o)},'image/jpeg',.82)};img.src=u}
async function photoSave(){const b=PH;if(!b||!ME)return;toast('Enviando foto…');const path=ME.id+'/avatar.jpg',u=await SB.storage.from('avatars').upload(path,b,{upsert:true,contentType:'image/jpeg',cacheControl:'3600'});if(u.error)return toast('Falha ao enviar a foto. Tente novamente.');
const r=await SB.rpc('set_avatar',{p_path:path});if(r.error)return toast('Não foi possível salvar a foto.');const p=await SB.from('profiles').select('*').eq('id',ME.id).single();if(p.data)ME=p.data;const o=$('phov');if(o&&o.remove)o.remove();PH=null;toast('✅ Foto atualizada!');go('me')}
async function photoRemove(){if(!ME||!ME.avatar_path)return;await SB.storage.from('avatars').remove([ME.avatar_path]);const r=await SB.rpc('remove_avatar');if(r.error)return toast('Não foi possível remover a foto.');ME.avatar_path=null;ME.avatar_v=Date.now();toast('Foto removida');go('me')}
async function meOnlineX(){await meOnline();const st=UF.find(x=>x[0]==ME.state),bs='style="padding:9px 14px;font-size:13px"';
const blk=`<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:10px">${av(ME.avatar_path,ME.avatar_v,84)}<div style="flex:1"><b>${esc(ME.username)}</b><div class="mu">${st?st[1]+' ('+st[0]+')':'Região não definida'}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn g" ${bs} onclick="pickPhoto()">Alterar foto</button>${ME.avatar_path?`<button class="btn g" ${bs} onclick="photoRemove()">Remover</button>`:''}</div></div></div><input id="pf" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="photoPick(this)">
<div class="card" style="margin-bottom:10px"><b>Região</b><div class="mu">${st?'Selecionado: '+st[1]+' ('+st[0]+')':'Escolha seu estado para competir no ranking estadual.'}</div><button class="btn g" style="margin-top:8px;${bs.slice(7,-1)}" onclick="rgOpen()">${st?'Alterar estado':'Escolher estado'}</button><div id="rgb"></div></div>`;
app.innerHTML=app.innerHTML.replace('</h1>','</h1>'+blk).replace(/(<input id="nm"[^>]*?)>/,'$1 oninput="nkCheck(\'nm\',\'nmm\')">').replace('<br><br><button class="btn g" onclick="rename()">Salvar nome</button> <span id="nmm" class="mu"></span>','<div id="nmm" class="nk"></div><br><button class="btn g" onclick="rename()">Salvar nome</button>')}
function rkTab(t){RK.tab=t;rankSB()}
function rkUf(){stBox('rku',RK.uf,uf=>{RK.uf=uf;rankSB()})}
async function rankSB(){const el=$('gl');if(!el)return;if(!RK.uf&&ME&&ME.state)RK.uf=ME.state;const T=[['g','Global'],['w','Semanal'],['n','Nacional'],['e','Estadual']],reg=RK.tab=='n'||RK.tab=='e',st=UF.find(x=>x[0]==RK.uf);
el.innerHTML=(ME?'':'<p class="mu">🔒 <a href="#" style="color:var(--lime)" onclick="go(\'auth\');return false">Entre</a> para aparecer no ranking.</p>')+`<div class="chips">${T.map(([k,n])=>`<button class="chip ${RK.tab==k?'sel':''}" onclick="rkTab('${k}')">${n}</button>`).join('')}</div>`+(reg?`<div class="chips"><button class="chip ${RK.per=='g'?'sel':''}" onclick="RK.per='g';rankSB()">Geral</button><button class="chip ${RK.per=='w'?'sel':''}" onclick="RK.per='w';rankSB()">Semanal</button></div>`:'')+(RK.tab=='e'?`<button class="btn g" style="padding:9px 14px;font-size:13px" onclick="rkUf()">${st?st[1]+' ('+st[0]+') ▾':'Escolher estado ▾'}</button><div id="rku"></div>`:'')+'<div id="rkl" style="margin-top:8px"><p class="mu">Carregando…</p></div>';
if(RK.tab=='e'&&!RK.uf){$('rkl').innerHTML='<p class="mu">Escolha um estado para ver o ranking estadual.</p>';return}
const per=RK.tab=='w'||(reg&&RK.per=='w')?'weekly':'global',scope=RK.tab=='n'?'nacional':RK.tab=='e'?'estado':'todos';
const r=await SB.rpc('get_leaderboard_v2',{p_period:per,p_scope:scope,p_state:RK.tab=='e'?RK.uf:null,p_limit:50});if(!$('rkl'))return;if(r.error){$('rkl').innerHTML='<p class="mu">Não foi possível carregar o ranking agora.</p>';return}
const L=r.data||[];$('rkl').innerHTML=L.length?L.map(x=>{const me=ME&&x.username==ME.username;return`<div class="row" style="${me?'background:#c6ff1a12;border-radius:10px;padding-left:6px':''}"><span class="pos p${x.pos}">${x.pos}</span>${av(x.avatar_path,x.avatar_v,38)}<div style="flex:1;min-width:0"><b style="cursor:pointer" onclick="openPub('${x.username}')">${esc(x.username)}${me?' (você)':''}</b><div class="mu">Nv ${lvl(x.xp)} · ${x.xp} XP · ${x.games} partidas${x.state?' · '+x.state:''}</div></div><b style="color:var(--lime)">${x.score}</b></div>`}).join(''):`<p class="mu">${RK.tab=='e'?'Ainda não há jogadores neste estado. Convide amigos e seja o primeiro!':RK.tab=='n'?'Ainda não há jogadores com região definida.':'Ninguém ainda. Seja o primeiro!'}</p>`}
initAuth();
go('home');
</script></body></html>
